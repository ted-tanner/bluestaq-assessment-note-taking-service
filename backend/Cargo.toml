[package]
name = "bluestaq-notes"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-csrf = "0.8"
actix-web = { version = "4.18", default-features = false, features = ["macros", "cookies"] }
argon2-kdf = "1.7.5"
async-trait = "0.1"
base64 = "0.22"
diesel = { version = "2.3", default-features = false, features = ["sqlite", "r2d2"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
dotenvy = "0.15"
email_address = "0.2"
env_logger = "0.11"
hmac = "0.12"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
log = "0.4"
rand = "0.8"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
